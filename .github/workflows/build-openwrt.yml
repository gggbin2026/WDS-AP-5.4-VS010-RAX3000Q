name: Build 5.4 firmware (VS010 + RAX3000Q / WDS + AP)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '机型'
        required: false
        default: 'all'
        type: choice
        options: [all, cucc_vs010, cmcc_rax3000q]
      mode:
        description: '模式'
        required: false
        default: 'all'
        type: choice
        options: [all, wds, ap]

# 显式授权：softprops/action-gh-release 需要 contents: write，
# 不再依赖仓库 Settings 里默认的只读 GITHUB_TOKEN（否则报
# "Resource not accessible by integration"，固件仍会出但发不了 Release）。
permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  # 生成的固件长期保存在 Releases（GitHub Release 无过期时间），
  # 但只保留最新 5 个（每个 Release = 1 个 .bin + 1 个 .sha256）。
  # 想保留 5 轮构建（20 个固件）改成 20 即可；0 = 不清理。
  KEEP_RELEASES: 5

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [cucc_vs010, cmcc_rax3000q]
        mode: [wds, ap]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Init
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y squashfs-tools
        sh verify.sh

    - name: Apply installed baseline (both devices)
      run: |
        if [ -f capture/installed-allowlist.txt ]; then
          echo "[baseline] 检测到实机最干净系统的 opkg 清单，两个机型共用同一份精简标准"
          sh tools/apply-installed-baseline.sh --dryrun
        else
          echo "[baseline] 无实机清单，使用仓库默认 prune.list"
        fi

    - name: Apply captured prune list
      run: |
        if [ -f capture/prune-real.txt ]; then
          echo "[capture] 检测到实机导出的删除清单，回灌 prune.list（含无线栈护栏）"
          sh tools/build-from-capture.sh --capture=capture/prune-real.txt --dryrun
        else
          echo "[capture] 无实机清单，使用仓库默认 prune.list"
        fi

    - name: Build
      id: build
      run: |
        D=${{ matrix.device }}
        M=${{ matrix.mode }}
        if [ "${{ inputs.device }}" != "all" ] && [ "${{ inputs.device }}" != "$D" ]; then echo "跳过 $D/$M"; exit 0; fi
        if [ "${{ inputs.mode }}"   != "all" ] && [ "${{ inputs.mode }}"   != "$M" ]; then echo "跳过 $D/$M"; exit 0; fi
        sh build/build.sh --device=$D --mode=$M
        echo "done=true" >> $GITHUB_OUTPUT

    - name: Upload firmware
      if: steps.build.outputs.done == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: 5.4-${{ matrix.device }}-${{ matrix.mode }}
        # GitHub artifact 最长 90 天会自动过期；真正「长期保存」以 Release 为准。
        retention-days: 90
        path: |
          Nwrt-QSDK12.2-5.4-*.bin
          Nwrt-QSDK12.2-5.4-*.sha256

    - name: Release
      if: steps.build.outputs.done == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: fw-5.4-${{ matrix.device }}-${{ matrix.mode }}-${{ github.run_number }}
        name: ${{ matrix.device }} · ${{ matrix.mode }} · 5.4
        body: |
          **底座**：官方 5.4.213 闭源无线栈，kernel FIT / BDF / 驱动一字未动 → 有线无线照常用、不自动重启。

          | 项 | 值 |
          |---|---|
          | 模式 | `${{ matrix.mode }}`（wds=网桥自动配对 / ap=接入点）；`vs010-mode set wds\|ap` 可切 |
          | **管理 IP** | **WDS 主 `172.10.10.241` / WDS 客户端 `172.10.10.242` / AP `172.10.10.241`**，掩码均 `255.255.252.0`（/22）；进系统用 `vs010-role master\|client\|auto` 或「状态 → 主题与 WDS 角色」页自选 |
          | 主题 | 官方 **Argon 1.7.2**（默认）+ 已注入 **Argon v2.4.3**（上游最后一个 Lua 兼容版，独立目录零覆盖）；`vs010-theme argon243\|argon` 或页面按钮一键切、随时切回 |
          | WDS 主客 | 主 `WDS-Z` = .241 / 客户端 `WDS-K` = .242，两台各自选一次即可，不用重刷、不用串口 |
          | 账号 | SSH / LuCI / 串口 **`root` / `admin`**；串口 `ttyMSM0 115200n8` |
          | 界面 | Argon「状态」菜单内 **网桥状态 / AP 状态 / WDS·机器狗·Snooping 控制台**（`/cgi-bin/luci/admin/status/vs010_bridge` 等）；也可直接 `/bridge/` `/ap/`；TTYD `/ttyd/` |
          | 网络 | WAN+LAN 全进 br-lan、STP 开、**IPv6 关**、防火墙关、WAN/WAN6 每次开机删 |
          | 网口速率 | **只列已插网线口**（不再铺一堆）：`portstat` 读交换芯片 **PHY 实测**；Argon「已插网线速率」页 + `/bridge/` `/ap/` 两页同款精简表 |
          | NTP | 纯内网客户端 `172.10.10.254` / `172.100.10.254` / `192.168.1.254`，**5 分钟循环** |
          | WDS | `WDS-Bridge-Z` / `WDS123456`，5G **HE160**、2.4G 不桥接；主 `WDS-Z` / 客户端 `WDS-K` |
          | AP | `VS010-AP` / `RAX3000Q-AP`（按机型），密码 `AP123456`，设备名 `AP` |
          | 无线 | **信道自动（ACS）**、网桥/AP 均开 **MU-MIMO + WMM**；弱信号剔除/拒绝 `-70 dBm`（改 `/etc/vs010/weak.rssi`，网桥 AP 都有）；5G HE160 单 SSID；MAC 由 **ART 自动读**、零手填 |
          | 无线 | 网桥/AP 均开 **MU-MIMO + WMM**；5G 仅 1 个 SSID，MAC 自动读 ART；系统总览 IPv6 块已随 `ip6tables` 移除而消失 |

          **插件**：保留 **TTYD** + Argon 主题 + LuCI + 闭源 qca-wifi/NSS；新增主题内「网桥状态 / AP 状态 / WDS 控制台」、`portstat` / `wifi-check` / `luci-check`、`ntp-sync`、`dhcp-guard`（monitor）、**机器狗 `bridge-watchdog`（🔴 出厂停用，`on` 才启用）**。
          已剔除 DDNS / UPnP / ZeroTier / 定时重启 autoreboot / mia / pppoe 等 36 项无关自启与控制器（不启动即不占资源）。

          🔴 <u>**WDS 主 / 客户端两端都绝不能开 DHCP 服务端**</u>：本机出厂已 `dhcp.lan.ignore=1` + 停 `dnsmasq`；客户端那台若也发地址，内网会因双 DHCP 乱掉（开机日志 `[!!! DHCP !!!]` 同提示）。

          🔴 **刷机**：按机型严格对应、**别勾「保留配置」**。刷完 `wifi-check` + `portstat` + `luci-check` 三行取证；`uptime` 静置 12 分钟不归零。
        files: |
          Nwrt-QSDK12.2-5.4-*.bin
          Nwrt-QSDK12.2-5.4-*.sha256

  # 固件「长期保存」= Release 永久保留（artifact 90 天会过期，只是临时下载）。
  # 单独 job + needs: build：等 4 个 matrix job 全部发完再清理，避免并发互删。
  cleanup:
    needs: build
    if: success()
    runs-on: ubuntu-22.04
    steps:
    - name: Keep latest firmware releases
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: ${{ env.KEEP_RELEASES }}
      run: |
        set -euo pipefail
        echo "[retention] 固件长期保存在 Releases；只保留最新 $KEEP 个（每个 = 1 个 .bin）"
        [ "$KEEP" -ge 1 ] || { echo "[retention] KEEP<1，跳过清理"; exit 0; }
        gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
          --json tagName,createdAt \
          --jq 'sort_by(.createdAt) | reverse | map(select(.tagName | startswith("fw-5.4-"))) | .[].tagName' \
          > /tmp/all-tags.txt
        total=$(wc -l < /tmp/all-tags.txt)
        tail -n +$((KEEP+1)) /tmp/all-tags.txt > /tmp/old-tags.txt || true
        old=$(wc -l < /tmp/old-tags.txt)
        echo "[retention] 现有 $total 个固件 Release，保留前 $KEEP 个，清理 $old 个"
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          echo "  - 删除 $tag"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" -y --cleanup-tag \
            || echo "  ::warning::删除 $tag 失败（下次运行会重试）"
        done < /tmp/old-tags.txt
