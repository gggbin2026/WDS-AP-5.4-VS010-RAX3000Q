name: Build 5.4 firmware (VS010 + RAX3000Q / WDS + AP)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '机型'
        required: false
        default: 'all'
        type: choice
        options: [all, cucc_vs010, cmcc_rax3000q]
      mode:
        description: '模式'
        required: false
        default: 'all'
        type: choice
        options: [all, wds, ap]

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [cucc_vs010, cmcc_rax3000q]
        mode: [wds, ap]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Init
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y squashfs-tools
        sh verify.sh

    - name: Apply captured prune list
      run: |
        if [ -f capture/prune-real.txt ]; then
          echo "[capture] 检测到实机导出的删除清单，回灌 prune.list（含无线栈护栏）"
          sh tools/build-from-capture.sh --capture=capture/prune-real.txt --dryrun
        else
          echo "[capture] 无实机清单，使用仓库默认 prune.list"
        fi

    - name: Build
      id: build
      run: |
        D=${{ matrix.device }}
        M=${{ matrix.mode }}
        if [ "${{ inputs.device }}" != "all" ] && [ "${{ inputs.device }}" != "$D" ]; then echo "跳过 $D/$M"; exit 0; fi
        if [ "${{ inputs.mode }}"   != "all" ] && [ "${{ inputs.mode }}"   != "$M" ]; then echo "跳过 $D/$M"; exit 0; fi
        sh build/build.sh --device=$D --mode=$M
        echo "done=true" >> $GITHUB_OUTPUT

    - name: Upload firmware
      if: steps.build.outputs.done == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: 5.4-${{ matrix.device }}-${{ matrix.mode }}
        path: |
          Nwrt-QSDK12.2-5.4-*.bin
          Nwrt-QSDK12.2-5.4-*.sha256

    - name: Release
      if: steps.build.outputs.done == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: fw-5.4-${{ matrix.device }}-${{ matrix.mode }}-${{ github.run_number }}
        name: ${{ matrix.device }} · ${{ matrix.mode }} · 5.4
        body: |
          **底座**：官方 5.4.213 闭源无线栈，kernel FIT / BDF / 驱动一字未动 → 有线无线照常用、不自动重启。

          | 项 | 值 |
          |---|---|
          | 模式 | `${{ matrix.mode }}`（wds=网桥自动配对 / ap=接入点）；`vs010-mode set wds\|ap` 可切 |
          | **管理 IP** | **`172.10.10.241 / 255.255.252.0`**（/22） |
          | 账号 | SSH / LuCI / 串口 **`root` / `admin`**；串口 `ttyMSM0 115200n8` |
          | 界面 | `/bridge/` `/ap/`（丰富状态页）、`/cgi-bin/luci/`（**Argon**，427 已修）、TTYD `/ttyd/` |
          | 网络 | WAN+LAN 全进 br-lan、STP 开、**IPv6 关**、防火墙关、WAN/WAN6 每次开机删 |
          | 网口速率 | `portstat` 读交换芯片 **PHY 实测**（netdev 不上报不显示假 1000M）；Argon 主题页 `/cgi-bin/luci/admin/status/vs010_ports` + `/bridge/` `/ap/` |
          | NTP | 纯内网客户端 `172.10.10.254` / `172.100.10.254` / `192.168.1.254`，**5 分钟循环** |
          | WDS | `WDS-Bridge-Z` / `WDS123456`，5G **HE160**、2.4G 不桥接；主 `WDS-Z` / 客户端 `WDS-K` |
          | AP | `VS010-AP` / `RAX3000Q-AP`（按机型），密码 `AP123456`，设备名 `AP` |

          **插件**：保留 **TTYD** + Argon 主题 + LuCI + 闭源 qca-wifi/NSS；新增状态页、`portstat` / `wifi-check` / `luci-check`、`ntp-sync`、`dhcp-guard`（monitor）、**机器狗 `bridge-watchdog`（🔴 出厂停用，`on` 才启用）**。
          已剔除 DDNS / UPnP / ZeroTier / 定时重启 autoreboot / mia / pppoe 等 36 项无关自启与控制器（不启动即不占资源）。

          🔴 **刷机**：按机型严格对应、**别勾「保留配置」**。刷完 `wifi-check` + `portstat` + `luci-check` 三行取证；`uptime` 静置 12 分钟不归零。
        files: |
          Nwrt-QSDK12.2-5.4-*.bin
          Nwrt-QSDK12.2-5.4-*.sha256
